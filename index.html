<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="App de treino de academia — séries A e B">
  <title>Treino Academia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Treino</h1>
    <button type="button" id="btn-start-workout" class="btn btn-primary">Iniciar treino</button>
  </header>

  <nav class="series-tabs" role="tablist" aria-label="Série de treino">
    <button type="button" class="series-tab active" data-series="A" role="tab" aria-selected="true">Série A</button>
    <button type="button" class="series-tab" data-series="B" role="tab" aria-selected="false">Série B</button>
  </nav>

  <div class="progress-nav">
    <button type="button" id="btn-prev-exercise" class="btn btn-secondary" aria-label="Exercício anterior">← Anterior</button>
    <span id="progress-label" class="progress-label"></span>
    <button type="button" id="btn-next-exercise" class="btn btn-secondary" aria-label="Próximo exercício">Próximo →</button>
  </div>

  <main id="exercise-list" class="exercise-list" aria-live="polite"></main>

  <script src="js/program.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/session.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
